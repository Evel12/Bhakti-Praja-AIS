[project]
name = "bhakti-praja-ai-service"
version = "0.1.0"
description = "Separated FastAPI + RAG + Ollama quiz generation service for EXAMNIA assessment-backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
